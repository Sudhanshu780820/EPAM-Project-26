    function hide_steps(){
        document.getElementById("demo").style.display="none";

    }
    function validateCustomer(){
        var custId=document.getElementById("custId").value;
    
        var validatecust=custId.includes("XYZ");
        if(validatecust){
           alert("Validation Successfull");
        }else if(custId==""){
            alert("Customer id can't be empty");
        }
        else{
            document.write("Your customer id is wrong");
        }
    }
    function generateCoupan(){
        var custId=document.getElementById("custId").value;
        var x=custId+9789;
        var validatecust=custId.includes("XYZ");
        if(validatecust){
            document.write("Your coupan code is "+x);
        }else if(custId==""){
            alert("Customer id can't be empty");
        }
        else{
            document.write("Your customer id is wrong");
        }
    }
